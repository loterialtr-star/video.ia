name: Fabrica Viral RD

on:
  schedule:
    - cron: '30 10 * * *'  # 06:30 La Paz = 10:30 UTC
  workflow_dispatch:

jobs:
  crear-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      
      - name: Instalar librerias
        run: pip install -r requirements.txt
      
      - name: Generar guion y audio y video
        run: python robot/generador.py
      
      - name: Subir video generado
        uses: actions/upload-artifact@v4
        with:
          name: video-viral
          path: output/
